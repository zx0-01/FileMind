[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "filemind-cli"
version = "2.0.0"
description = "A smart, safe, terminal-first file manager."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "zx0-01" }]
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
filemind = "filemind.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/filemind"]
